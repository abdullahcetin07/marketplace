name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"

jobs:

  # Formatting and static analysis run without services — they are fast and
  # they fail on the majority of bad pushes, so they gate the expensive job.
  quality:
    name: Lint & Analyse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, intl, mbstring, pdo_pgsql, redis, zip, gd
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (formatting)
        run: ./vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --error-format=github

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      # The suite runs on in-memory SQLite by default (.env.testing). Postgres
      # and Redis are here for the integration tests that need real behaviour —
      # JSONB, partial indexes, tagged cache flushing.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketplaceos_test
          POSTGRES_USER: marketplaceos
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, intl, mbstring, pdo_pgsql, pdo_sqlite, redis, zip, gd
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Architecture rules
        run: ./vendor/bin/pest --testsuite=Architecture

      - name: Test suite
        run: ./vendor/bin/pest --coverage --min=70 --ci
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      # Integration tests run against real Postgres, because SQLite silently
      # accepts things Postgres rejects — and vice versa.
      - name: Integration suite (PostgreSQL)
        run: |
          php artisan migrate --force
          ./vendor/bin/pest --testsuite=Feature
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: marketplaceos_test
          DB_USERNAME: marketplaceos
          DB_PASSWORD: secret
          CACHE_STORE: redis
          REDIS_HOST: 127.0.0.1

  # Verifies the production image actually builds. A Dockerfile that only ever
  # gets built at deploy time is a Dockerfile that breaks at deploy time.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
