server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Uploads are capped by PHP (post_max_size = 24M); matching here means the
    # client gets a clean 413 instead of a broken connection.
    client_max_body_size 24M;

    # --- Security headers ----------------------------------------------------
    # The storefront is a separate Next.js origin with its own CSP; these
    # protect the API responses and the two Filament panels.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # HSTS is set at the TLS-terminating load balancer, not here — setting it
    # on a plain-HTTP local container would poison the developer's browser.

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Long-lived caching for Filament's fingerprinted assets.
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $http_x_forwarded_proto;

        # Long enough for a bulk admin action, short enough that a wedged
        # request does not hold a connection forever.
        fastcgi_read_timeout 70s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Anything else ending in .php is not a front controller — refuse it rather
    # than passing it to FPM.
    location ~ \.php$ {
        return 404;
    }

    # Never serve dotfiles (.env, .git) even if one ends up under public/.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /dev/stderr warn;
    access_log /dev/stdout;
}
