; MarketplaceOS PHP settings — applied in every environment.

memory_limit = 512M
max_execution_time = 60

; Bulk product imports arrive as multi-megabyte CSVs; the media library caps
; individual uploads at 10 MB (App\Shared\Traits\HasMedia::maxUploadSize).
upload_max_filesize = 20M
post_max_size = 24M
max_file_uploads = 30

; Never render an error into the response body. Errors go to the log; the
; application returns its own JSON envelope. Overridden in docker/php/dev.ini.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

date.timezone = Europe/Istanbul

; Do not advertise the PHP version in response headers.
expose_php = Off

; Multibyte defaults for Turkish content.
default_charset = "UTF-8"
mbstring.internal_encoding = UTF-8

; Sessions are stored in Redis by Laravel, not by PHP; these apply only to
; anything that bypasses the framework.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
