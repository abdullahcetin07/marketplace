[www]
; Dynamic process management. `ondemand` adds latency to the first request
; after a quiet period; `static` wastes memory on a small box. `dynamic` is
; the right default for a containerised app that is horizontally scaled.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

; Recycle workers periodically. This is the cheapest insurance against a slow
; memory leak in a long-lived process.
pm.max_requests = 500

; Log slow requests so a pathological endpoint is visible without an APM.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Kill a request that exceeds this. Must be >= php.ini max_execution_time.
request_terminate_timeout = 65s

; Surface worker stdout/stderr in the container log rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no

; Health endpoint for the load balancer / orchestrator.
ping.path = /fpm-ping
pm.status_path = /fpm-status
