; OPcache — production only.
;
; validate_timestamps=0 is the setting that matters: PHP stops stat()-ing every
; file on every request. It also means a deploy MUST restart the container (or
; reset OPcache), because changed files will otherwise be ignored entirely.
; That is the correct trade in an immutable-image deployment.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT. Modest gains for a request-response workload — most time is spent in
; I/O, not PHP — but free once the buffer is sized.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Preloading is deliberately NOT configured. Laravel's preload story is
; fragile across versions and the failure mode (a stale preloaded class) is
; extremely hard to diagnose. Revisit with measurement, not by default.
