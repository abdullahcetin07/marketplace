; Xdebug — development image only. Never present in the prod target.
;
; mode=develop,coverage rather than debug: step debugging carries a large
; runtime cost and is off until you ask for it. Start a debug session with:
;
;   XDEBUG_TRIGGER=1 php artisan ...
;
; or by sending the XDEBUG_TRIGGER cookie/header from the browser.

xdebug.mode = develop,coverage
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = marketplaceos
xdebug.log_level = 0

; Deep recursion in Eloquent relations trips the default of 256.
xdebug.max_nesting_level = 512
